version: 2
updates:
  # Keeps the pinned signalk-server plugin-ci workflow (and any actions) current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # npm dev dependencies (typescript, vitest, esbuild, @types/node): one weekly PR
  # for all minor and patch bumps; major bumps get a PR each.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
